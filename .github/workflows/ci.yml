name: CI

on:
  push:
    branches: [master, v2.0]
  pull_request:
    branches: [master]

jobs:
  package:
    name: Build & test (SPM)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build \
            -scheme DatePicker \
            -destination 'generic/platform=iOS Simulator' \
            -quiet
      - name: Test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          xcodebuild test \
            -scheme DatePicker \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -quiet

  example:
    name: Build example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pod install
        run: pod install --project-directory=Example
      - name: Build
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          xcodebuild build \
            -workspace Example/DatePicker.xcworkspace \
            -scheme DatePicker-Example \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -quiet

  lint:
    name: Pod lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Lint podspec
        run: pod lib lint DatePicker.podspec
